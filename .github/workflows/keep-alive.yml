# Garde le site eveille sur l'offre gratuite de Render (mise en veille
# apres 15 min sans visite) et garde la base Aiven active.
# Le site a appeler se regle dans GitHub : Settings > Secrets and variables
# > Actions > Variables > SITE_URL (ex : https://ayora.onrender.com)
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SITE_URL != '' }}
    steps:
      - name: Ping du site et de l'API (touche la base)
        run: |
          curl -fsS -m 120 -o /dev/null -w "page: %{http_code}\n" "${{ vars.SITE_URL }}/ayora/" || true
          curl -fsS -m 120 -o /dev/null -w "api: %{http_code}\n" "${{ vars.SITE_URL }}/ayora/api/vendors/categories" || true
